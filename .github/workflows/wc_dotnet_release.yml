name: 🏷️ CD · .NET Release

on:
  workflow_call:
    inputs:
      force:
        description: Release unchanged source.
        required: false
        default: false
        type: boolean
      notarize_macos:
        description: Sign and notarize macOS app packages.
        required: false
        default: false
        type: boolean
      macos_update_public_key:
        description: Base64 Ed25519 public key for direct macOS updates.
        required: false
        default: ''
        type: string
    secrets:
      MACOS_NOTARY_ISSUER_ID:
        required: false
      MACOS_NOTARY_KEY:
        required: false
      MACOS_NOTARY_KEY_ID:
        required: false
      MACOS_SIGNING_CERTIFICATE:
        required: false
      MACOS_SIGNING_CERTIFICATE_PASSWORD:
        required: false
      MACOS_UPDATE_PRIVATE_KEY:
        required: false
    outputs:
      commit_sha:
        description: Build commit.
        value: ${{ jobs.build.outputs.commit_sha }}
      dry_run:
        description: Built a snapshot instead of a release.
        value: ${{ jobs.build.outputs.dry_run }}
      version:
        description: Resolved version.
        value: ${{ jobs.build.outputs.version }}

permissions: {}

concurrency:
  group: dotnet-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  mode:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      dry_run: ${{ steps.release_info.outputs.dry_run }}
    steps:
      - name: "🧑‍💻 Checkout"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: "🏷️ Read Latest Tag"
        id: latest_tag
        shell: sh
        run: |
          set -eu
          latest_tag=$(git tag --merged HEAD --sort=-creatordate | sed -n '1p')
          printf 'latest_tag=%s\n' "${latest_tag:-none}"
          printf 'latest_tag=%s\n' "${latest_tag}" >> "${GITHUB_OUTPUT}"

      - name: "🏷️ Release Mode"
        id: release_info
        shell: sh
        run: |
          set -eu
          dry_run=true
          if [ "${{ inputs.force }}" = 'true' ] || [ -z "${{ steps.latest_tag.outputs.latest_tag }}" ]; then
            dry_run=false
          elif git diff --name-only "${{ steps.latest_tag.outputs.latest_tag }}"..HEAD | while IFS= read -r path; do
            case "${path}" in
              README*|*/README*|docs/*|*/docs/*|*.md|.github/*|.editorconfig|.gitignore|LICENSE*|*/LICENSE*|\
              test/*|tests/*|spec/*|specs/*|*/test/*|*/tests/*|*/spec/*|*/specs/*|\
              example/*|examples/*|benchmark/*|benchmarks/*|*/example/*|*/examples/*|*/benchmark/*|*/benchmarks/*)
                ;;
              *)
                exit 1
                ;;
            esac
          done; then
            :
          else
            dry_run=false
          fi
          printf 'dry_run=%s\n' "${dry_run}"
          printf 'dry_run=%s\n' "${dry_run}" >> "${GITHUB_OUTPUT}"

  build:
    needs: mode
    permissions:
      contents: read
    uses: ./.github/workflows/wc_dotnet_build_common.yml
    with:
      ref: ${{ github.sha }}
      dry_run: ${{ needs.mode.outputs.dry_run == 'true' }}

  native:
    needs: build
    permissions:
      contents: read
    uses: ./.github/workflows/wc_dotnet_build_native.yml
    with:
      dry_run: ${{ needs.build.outputs.dry_run == 'true' }}
      notarize_macos: ${{ inputs.notarize_macos }}
      macos_update_public_key: ${{ inputs.macos_update_public_key }}
      version: ${{ needs.build.outputs.version }}
    secrets: inherit

  release:
    needs:
      - build
      - native
    if: needs.build.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: "📥 Download Release Assets"
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true
          github-token: ${{ github.token }}

      - name: "🔐 Sign macOS Update Feeds"
        if: inputs.macos_update_public_key != ''
        shell: sh
        env:
          MACOS_UPDATE_PRIVATE_KEY: ${{ secrets.MACOS_UPDATE_PRIVATE_KEY }}
          MACOS_UPDATE_PUBLIC_KEY: ${{ inputs.macos_update_public_key }}
        run: |
          set -eu
          test -n "${MACOS_UPDATE_PRIVATE_KEY}"
          private_key=$(mktemp "${RUNNER_TEMP}/macos-update.XXXXXX")
          trap 'rm -f "${private_key}"' EXIT INT TERM
          {
            printf '\060\056\002\001\000\060\005\006\003\053\145\160\004\042\004\040'
            printf '%s' "${MACOS_UPDATE_PRIVATE_KEY}" | base64 --decode
          } > "${private_key}"
          test "$(wc -c < "${private_key}" | tr -d ' ')" = 48
          derived_public_key=$(openssl pkey -inform DER -in "${private_key}" -pubout -outform DER | tail -c 32 | base64 --wrap=0)
          test "${derived_public_key}" = "${MACOS_UPDATE_PUBLIC_KEY}"

          found=false
          for asset in release-assets/*-macos-*.dmg; do
            test -f "${asset}" || continue
            found=true
            asset_name=${asset##*/}
            architecture=$(printf '%s\n' "${asset_name}" | sed -n 's/.*-macos-\(arm64\|x64\)\.dmg$/\1/p')
            test -n "${architecture}"
            signature=$(openssl pkeyutl -sign -inkey "${private_key}" -keyform DER -rawin -in "${asset}" | base64 --wrap=0)
            appcast="release-assets/appcast-macos-${architecture}.xml"
            asset_size=$(wc -c < "${asset}" | tr -d ' ')
            cat > "${appcast}" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <rss xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" version="2.0">
            <channel>
              <title>${{ github.repository }} macOS updates</title>
              <item>
                <title>Version ${{ needs.build.outputs.version }}</title>
                <enclosure url="https://github.com/${{ github.repository }}/releases/download/${{ needs.build.outputs.version }}/${asset_name}" sparkle:version="${{ needs.build.outputs.version }}" sparkle:shortVersionString="${{ needs.build.outputs.version }}" sparkle:os="macos" sparkle:edSignature="${signature}" length="${asset_size}" type="application/octet-stream" />
              </item>
            </channel>
          </rss>
          EOF
            openssl pkeyutl -sign -inkey "${private_key}" -keyform DER -rawin -in "${appcast}" | base64 --wrap=0 > "${appcast}.signature"
            printf 'appcast=%s\n' "${appcast}"
          done
          test "${found}" = true

      - name: "🔐 Create Checksums"
        shell: sh
        run: |
          set -eu
          test -n "$(find release-assets -maxdepth 1 -type f -print -quit)"
          find release-assets -maxdepth 1 -type f -print | sort | while IFS= read -r asset; do
            sha256sum "${asset}" | sed 's#  release-assets/#  #'
          done > release-assets/SHA256SUMS

      - name: "🏷️ GitHub Release [${{ needs.build.outputs.version }}]"
        shell: sh
        run: |
          set -eu
          if GH_TOKEN="${{ github.token }}" gh release view "${{ needs.build.outputs.version }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "GitHub release already exists for ${{ needs.build.outputs.version }}"
            exit 0
          fi
          case "${{ needs.build.outputs.version }}" in
            *-*)
              GH_TOKEN="${{ github.token }}" gh release create "${{ needs.build.outputs.version }}" --repo "${{ github.repository }}" --target "${{ needs.build.outputs.commit_sha }}" --generate-notes --prerelease --latest=false
              ;;
            *)
              GH_TOKEN="${{ github.token }}" gh release create "${{ needs.build.outputs.version }}" --repo "${{ github.repository }}" --target "${{ needs.build.outputs.commit_sha }}" --generate-notes --latest
              ;;
          esac
          GH_TOKEN="${{ github.token }}" gh release upload "${{ needs.build.outputs.version }}" release-assets/* --repo "${{ github.repository }}" --clobber
