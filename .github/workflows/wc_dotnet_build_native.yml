name: 🧩 CI · .NET Native Build

on:
  workflow_call:
    inputs:
      dry_run:
        description: Build a snapshot without signing or notarizing.
        required: false
        default: true
        type: boolean
      notarize_macos:
        description: Sign and notarize macOS app packages.
        required: false
        default: false
        type: boolean
      macos_update_public_key:
        description: Base64 Ed25519 public key for direct macOS updates.
        required: false
        default: ''
        type: string
      version:
        description: Build version.
        required: true
        type: string
    secrets:
      MACOS_NOTARY_ISSUER_ID:
        required: false
      MACOS_NOTARY_KEY:
        required: false
      MACOS_NOTARY_KEY_ID:
        required: false
      MACOS_SIGNING_CERTIFICATE:
        required: false
      MACOS_SIGNING_CERTIFICATE_PASSWORD:
        required: false

permissions: {}

jobs:
  build:
    name: "📦 ${{ matrix.asset }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: linux-x64
            rid: linux-x64
            os: ubuntu-24.04
            package: tar.gz
          - asset: linux-arm64
            rid: linux-arm64
            os: ubuntu-24.04
            package: tar.gz
          - asset: linux-arm
            rid: linux-arm
            os: ubuntu-24.04
            package: tar.gz
          - asset: linux-musl-x64
            rid: linux-musl-x64
            os: ubuntu-24.04
            package: tar.gz
          - asset: linux-musl-arm64
            rid: linux-musl-arm64
            os: ubuntu-24.04
            package: tar.gz
          - asset: linux-musl-arm
            rid: linux-musl-arm
            os: ubuntu-24.04
            package: tar.gz
          - asset: win-x64
            rid: win-x64
            os: ubuntu-24.04
            package: zip
          - asset: win-x86
            rid: win-x86
            os: ubuntu-24.04
            package: zip
          - asset: win-arm64
            rid: win-arm64
            os: ubuntu-24.04
            package: zip
          - asset: macos-arm64
            rid: osx-arm64
            os: macos-14
            package: app-zip
          - asset: macos-x64
            rid: osx-x64
            os: macos-15-intel
            package: app-zip
    steps:
      - name: "🧑‍💻 Checkout"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: "🟣 Setup .NET"
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: "🔐 Configure macOS Signing"
        if: matrix.package == 'app-zip' && inputs.notarize_macos && inputs.dry_run == false
        shell: sh
        env:
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_SIGNING_CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
          MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          set -eu
          test -n "${MACOS_SIGNING_CERTIFICATE}"
          test -n "${MACOS_SIGNING_CERTIFICATE_PASSWORD}"
          test -n "${MACOS_NOTARY_KEY}"
          test -n "${MACOS_NOTARY_KEY_ID}"
          test -n "${MACOS_NOTARY_ISSUER_ID}"

          credentials_dir=$(mktemp -d "${RUNNER_TEMP}/macos-signing.XXXXXX")
          trap 'rm -rf "${credentials_dir}"' EXIT INT TERM
          keychain_path="${RUNNER_TEMP}/macos-signing.keychain-db"
          keychain_password=$(uuidgen)
          certificate_path="${credentials_dir}/developer-id.p12"
          notary_key_path="${credentials_dir}/AuthKey.p8"

          printf '%s' "${MACOS_SIGNING_CERTIFICATE}" | base64 --decode > "${certificate_path}"
          printf '%s' "${MACOS_NOTARY_KEY}" > "${notary_key_path}"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" -P "${MACOS_SIGNING_CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${keychain_path}"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${keychain_password}" "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"
          security default-keychain -s "${keychain_path}"
          xcrun notarytool store-credentials macos-notary \
            --key "${notary_key_path}" \
            --key-id "${MACOS_NOTARY_KEY_ID}" \
            --issuer "${MACOS_NOTARY_ISSUER_ID}" \
            --keychain "${keychain_path}"
          mkdir -p "${RUNNER_TEMP}/macos-signing"
          printf '%s\n' "${keychain_path}" > "${RUNNER_TEMP}/macos-signing/keychain-path"

      - name: "📦 Package [${{ inputs.version }}]"
        shell: sh
        run: |
          set -eu
          repository=${GITHUB_REPOSITORY#*/}
          asset='${{ matrix.asset }}'
          rid='${{ matrix.rid }}'
          package='${{ matrix.package }}'
          assets_dir='release-assets'
          archive_dir=$(mktemp -d "${RUNNER_TEMP}/dotnet-package.XXXXXX")
          dmg_stage=$(mktemp -d "${RUNNER_TEMP}/dotnet-dmg.XXXXXX")
          trap 'rm -rf "${archive_dir}" "${dmg_stage}"' EXIT INT TERM
          mkdir -p "${assets_dir}"

          publish() {
            output_dir=$1
            if [ -f scripts/publish.sh ]; then
              VERSION='${{ inputs.version }}' sh scripts/publish.sh "${rid}"
            else
              project=$(find . -type f -name '*.csproj' ! -path './test/*' ! -path './tests/*' | while IFS= read -r candidate; do
                if grep -Eq '<OutputType>(Exe|WinExe)</OutputType>' "${candidate}"; then
                  printf '%s\n' "${candidate}"
                fi
              done | sed -n '1p')
              if [ -z "${project}" ]; then
                project=$(find . -type f -name '*.csproj' ! -path './test/*' ! -path './tests/*' | sed -n '1p')
              fi
              test -n "${project}"
              dotnet publish "${project}" --configuration Release --runtime "${rid}" --self-contained true \
                -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
                -p:DebugType=none -p:DebugSymbols=false -p:Version='${{ inputs.version }}' \
                --output "${output_dir}"
            fi
          }

          if [ "${package}" = 'app-zip' ] && [ -f scripts/build-macos-app.sh ]; then
            package_log="${RUNNER_TEMP}/dotnet-macos-package.log"
            signing_identity='-'
            notary_profile=''
            notary_keychain=''
            if [ '${{ inputs.notarize_macos }}' = 'true' ] && [ '${{ inputs.dry_run }}' = 'false' ]; then
              notary_keychain=$(cat "${RUNNER_TEMP}/macos-signing/keychain-path")
              signing_identity=$(security find-identity -v -p codesigning | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | sed -n '1p')
              test -n "${signing_identity}"
              notary_profile='macos-notary'
            fi
            VERSION='${{ inputs.version }}' CODESIGN_IDENTITY="${signing_identity}" MACOS_UPDATE_PUBLIC_KEY='${{ inputs.dry_run == false && inputs.macos_update_public_key || '' }}' sh scripts/build-macos-app.sh "${rid}" > "${package_log}"
            bundle=$(sed -n '$p' "${package_log}")
            cat "${package_log}"
            test -d "${bundle}"
            zip_path="${assets_dir}/${repository}-${asset}.zip"
            ditto -c -k --sequesterRsrc --keepParent "${bundle}" "${zip_path}"

            if [ -n "${notary_profile}" ]; then
              xcrun notarytool submit "${zip_path}" \
                --keychain-profile "${notary_profile}" \
                --keychain "${notary_keychain}" \
                --wait \
                --timeout 90m
              xcrun stapler staple "${bundle}"
              xcrun stapler validate "${bundle}"
              codesign --verify --deep --strict --verbose=2 "${bundle}"
              rm -f "${zip_path}"
              ditto -c -k --sequesterRsrc --keepParent "${bundle}" "${zip_path}"
              ditto "${bundle}" "${dmg_stage}/${repository}.app"
              ln -s /Applications "${dmg_stage}/Applications"
              dmg_path="${assets_dir}/${repository}-${asset}.dmg"
              hdiutil create -volname "${repository}" -srcfolder "${dmg_stage}" -ov -format UDZO "${dmg_path}" >/dev/null
              hdiutil verify "${dmg_path}" >/dev/null
            fi
          else
            output_dir="out/${repository}-${asset}"
            publish "${output_dir}"
            test -d "${output_dir}"
            mkdir -p "${archive_dir}/${repository}"
            cp -R "${output_dir}/." "${archive_dir}/${repository}/"
            case "${package}" in
              tar.gz)
                tar -C "${archive_dir}" -czf "${assets_dir}/${repository}-${asset}.tar.gz" "${repository}"
                ;;
              zip|app-zip)
                (
                  cd "${archive_dir}"
                  zip -qr "${GITHUB_WORKSPACE}/${assets_dir}/${repository}-${asset}.zip" "${repository}"
                )
                ;;
              *)
                echo "Unsupported package: ${package}" >&2
                exit 1
                ;;
            esac
          fi
          test -n "$(find "${assets_dir}" -maxdepth 1 -type f -print -quit)"

      - name: "📦 Upload Release Assets"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets-${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 1
          path: release-assets
