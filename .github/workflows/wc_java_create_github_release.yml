name: 🏷️ CD · GitHub Release

on:
  workflow_call:
    inputs:
      run_id:
        required: false
        default: ''
        type: string
      commit_sha:
        required: true
        type: string
      prerelease:
        required: false
        default: false
        type: boolean
      version:
        required: true
        type: string

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: "📥 Download Build Artifact"
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: build-workspace
          path: ${{ github.workspace }}
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id || github.run_id }}

      - name: "📦 Prepare Release Assets"
        shell: sh
        run: |
          set -eu
          artifact_id=$(awk -F '[<>]' '/^[[:space:]]*<artifactId>/ { print $3; exit }' pom.xml)
          test -n "${artifact_id}"
          assets_dir="${RUNNER_TEMP}/release-assets"
          rm -rf "${assets_dir}"
          mkdir -p "${assets_dir}"
          cp pom.xml "${assets_dir}/${artifact_id}-${{ inputs.version }}.pom"
          find target -maxdepth 1 -type f -name "*-${{ inputs.version }}*.jar" -exec cp {} "${assets_dir}/" \;
          test -n "$(find "${assets_dir}" -maxdepth 1 -type f -name '*.jar' -print -quit)"

      - name: "🏷️ GitHub Release [${{ inputs.version }}]"
        shell: sh
        run: |
          set -eu
          if GH_TOKEN="${{ github.token }}" gh release view "${{ inputs.version }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "GitHub release already exists for ${{ inputs.version }}"
          elif [ "${{ inputs.prerelease }}" = "true" ]; then
            GH_TOKEN="${{ github.token }}" gh release create "${{ inputs.version }}" --repo "${{ github.repository }}" --target "${{ inputs.commit_sha }}" --generate-notes --prerelease --latest=false
          else
            GH_TOKEN="${{ github.token }}" gh release create "${{ inputs.version }}" --repo "${{ github.repository }}" --target "${{ inputs.commit_sha }}" --generate-notes --latest
          fi
          GH_TOKEN="${{ github.token }}" gh release upload "${{ inputs.version }}" "${RUNNER_TEMP}/release-assets"/* --repo "${{ github.repository }}" --clobber
