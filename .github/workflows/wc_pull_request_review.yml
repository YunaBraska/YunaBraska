name: "💬 CI · Pull Request Review"

on:
  workflow_call:

permissions: {}

jobs:
  request:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action == 'ready_for_review' &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: "💬 Request review"
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: sh
        run: |
          set -eu
          marker="<!-- yuna-pr-review:${HEAD_SHA} -->"
          comments=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" --jq '.[].body')
          if printf '%s\n' "${comments}" | grep -Fq "${marker}"; then
            echo "Review already requested for ${HEAD_SHA}."
            exit 0
          fi
          body=$(cat <<EOF
          @codex review

          Review the current pull request diff against main. Report only merge-blocking correctness, security, data-loss, privacy, signing, packaging, publishing, or release regressions. Do not report style, naming, formatting, generated files, dependency updates, or checks already covered by CI. Do not run project commands.

          ${marker}
          EOF
          )
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="${body}" >/dev/null
