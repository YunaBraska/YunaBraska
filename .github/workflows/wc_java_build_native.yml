name: 🧩 CD · Native

on:
  workflow_call:
    inputs:
      ref:
        description: Build commit.
        required: true
        type: string
      version:
        description: Resolved version.
        required: true
        type: string
      native_profile:
        description: Maven native profile.
        required: false
        default: native
        type: string
      linux_dockerfile:
        description: Linux native Dockerfile.
        required: false
        default: Dockerfile_Native
        type: string

permissions: {}

jobs:
  native:
    name: native / ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-latest
            distribution: temurin
            kind: linux
            platform: linux/amd64
            extension: .native
          - name: linux-arm64
            runner: ubuntu-latest
            distribution: temurin
            kind: linux
            platform: linux/arm64
            extension: .native
          - name: macos-arm64
            runner: macos-latest
            distribution: graalvm
            kind: host
            platform: ''
            extension: .native
          - name: windows-x64
            runner: windows-latest
            distribution: graalvm
            kind: host
            platform: ''
            extension: .exe
    steps:
      - name: "🧑‍💻 Checkout [${{ inputs.ref }}]"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 1
          ref: ${{ inputs.ref }}

      - name: "🔍 Read Java Info"
        id: java_info
        uses: YunaBraska/java-info-action@11a434ffbf6bb3357363d1933be71a4076a90a6b # v3

      - name: "☕ Setup Java [${{ steps.java_info.outputs.java_version }}]"
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ steps.java_info.outputs.java_version }}
          cache: maven

      - name: "🏷️ Set Project Version [${{ inputs.version }}]"
        shell: sh
        run: |
          set -eu
          build_output_timestamp=$(git log -1 --format=%cI HEAD)
          ${{ steps.java_info.outputs.cmd }} -B versions:set -DnewVersion="${{ inputs.version }}" -DgenerateBackupPoms=false
          ${{ steps.java_info.outputs.cmd }} -B versions:set-property -Dproperty=project.build.outputTimestamp -DnewVersion="${build_output_timestamp}" -DgenerateBackupPoms=false
          printf 'build_output_timestamp=%s\n' "${build_output_timestamp}"
          printf 'version=%s\n' "${{ inputs.version }}"

      - name: "🕹️ Setup QEMU"
        if: matrix.kind == 'linux'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: "🐳 Setup Buildx"
        if: matrix.kind == 'linux'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: "🧩 Build Native [${{ matrix.name }}]"
        if: matrix.kind == 'linux'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ inputs.linux_dockerfile }}
          target: export
          outputs: type=local,dest=target
          platforms: ${{ matrix.platform }}

      - name: "🧩 Build Native [${{ matrix.name }}]"
        if: matrix.kind == 'host'
        shell: sh
        run: |
          set -eu
          chmod +x ./mvnw
          ${{ steps.java_info.outputs.cmd }} -B -P${{ inputs.native_profile }} -DskipTests package

      - name: "📦 Prepare Native Asset [${{ matrix.name }}]"
        shell: sh
        run: |
          set -eu
          artifact_id=$(awk -F '[<>]' '/^[[:space:]]*<artifactId>/ { print $3; exit }' pom.xml)
          test -n "${artifact_id}"
          case "${{ matrix.kind }}" in
            linux)
              source=target/app.native
              ;;
            host)
              source="target/${artifact_id}.native${{ matrix.extension }}"
              ;;
          esac
          test -f "${source}"
          asset="${artifact_id}-${{ matrix.name }}-${{ inputs.version }}${{ matrix.extension }}"
          mkdir -p native
          cp "${source}" "native/${asset}"
          chmod +x "native/${asset}"
          printf 'asset=%s\n' "${asset}"
          printf 'source=%s\n' "${source}"

      - name: "📤 Upload Native Asset [${{ matrix.name }}]"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-${{ matrix.name }}
          path: native/*
          if-no-files-found: error
          retention-days: 1
