name: 🏷️ CD · Node GitHub Release

on:
  workflow_call:
    inputs:
      commit_sha:
        description: Build commit.
        required: true
        type: string
      version:
        description: Release version.
        required: true
        type: string

permissions: {}

jobs:
  release:
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/wc_github_create_release.yml
    with:
      commit_sha: ${{ inputs.commit_sha }}
      version: ${{ inputs.version }}
