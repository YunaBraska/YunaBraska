name: 🛠️ CI · Node Dependencies

on:
  workflow_call:
    inputs:
      dry_run:
        description: Dry run.
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: "🧑‍💻 Checkout"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
          submodules: recursive

      - name: "🟢 Setup Node [24]"
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm

      - name: "🛠️ Update"
        env:
          GH_TOKEN: ${{ github.token }}
        shell: sh
        run: |
          set -eu
          branch='bot/maintenance-node'
          if gh pr list --repo "${GITHUB_REPOSITORY}" --head "${branch}" --state open --json number --jq '.[0].number // empty' | grep -q .; then
            echo "${branch} already has an open pull request."
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
            if [ "${{ inputs.dry_run }}" = 'true' ]; then
              echo "Would open ${branch}."
            else
              gh pr create --repo "${GITHUB_REPOSITORY}" --base "${{ github.event.repository.default_branch }}" --head "${branch}" --title 'build: update Node dependencies' --body 'Updates Node dependencies and generated output.'
            fi
            exit 0
          fi
          npm update
          npm test
          if git diff --quiet -- package.json package-lock.json dist licenses.csv; then
            echo 'Node dependencies are current.'
            exit 0
          fi
          if [ "${{ inputs.dry_run }}" = 'true' ]; then
            echo "Would create ${branch}."
            exit 0
          fi
          git config user.name 'Kira Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "${branch}"
          git add -- package.json package-lock.json dist
          if [ -f licenses.csv ]; then
            git add -- licenses.csv
          fi
          git commit -m 'build: update Node dependencies'
          git push origin "${branch}"
          gh pr create --repo "${GITHUB_REPOSITORY}" --base "${{ github.event.repository.default_branch }}" --head "${branch}" --title 'build: update Node dependencies' --body 'Updates Node dependencies and generated output.'
