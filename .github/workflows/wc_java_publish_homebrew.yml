name: 🍺 CD · Publish Homebrew

on:
  workflow_call:
    inputs:
      formula_path:
        description: Formula path.
        required: true
        type: string
      tap_repository:
        description: Homebrew tap.
        required: true
        type: string
      asset_name:
        description: Release asset.
        required: true
        type: string
      version:
        description: Release version.
        required: true
        type: string
      dry_run:
        description: Update without pull request.
        required: false
        default: false
        type: boolean
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: true

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: "🧑‍💻 Checkout Tap"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: ${{ inputs.tap_repository }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: "🌿 Prepare Formula Branch"
        if: inputs.dry_run != true
        shell: sh
        run: |
          set -eu
          branch="bot/maintenance-homebrew-${{ github.event.repository.name }}-${{ inputs.version }}"
          git -C "${GITHUB_WORKSPACE}/tap" config user.name 'Kira Bot'
          git -C "${GITHUB_WORKSPACE}/tap" config user.email 'kira@noreply.github.com'
          if git -C "${GITHUB_WORKSPACE}/tap" ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
            git -C "${GITHUB_WORKSPACE}/tap" fetch origin "refs/heads/${branch}:refs/remotes/origin/${branch}"
            git -C "${GITHUB_WORKSPACE}/tap" switch --track -c "${branch}" "origin/${branch}"
          else
            git -C "${GITHUB_WORKSPACE}/tap" switch -c "${branch}"
          fi

      - name: "📥 Read Release Asset"
        id: release_asset
        shell: sh
        run: |
          set -eu
          assets_dir="${RUNNER_TEMP}/homebrew-assets"
          mkdir -p "${assets_dir}"
          GH_TOKEN="${{ github.token }}" gh release download "${{ inputs.version }}" --repo "${{ github.repository }}" --pattern "${{ inputs.asset_name }}" --dir "${assets_dir}"
          asset="${assets_dir}/${{ inputs.asset_name }}"
          test -f "${asset}"
          sha256=$(sha256sum "${asset}" | awk '{print $1}')
          url="https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/${{ inputs.asset_name }}"
          printf 'sha256=%s\n' "${sha256}" >> "${GITHUB_OUTPUT}"
          printf 'url=%s\n' "${url}" >> "${GITHUB_OUTPUT}"
          printf 'sha256=%s\n' "${sha256}"
          printf 'url=%s\n' "${url}"

      - name: "🍺 Update Formula"
        shell: sh
        run: |
          set -eu
          formula="${GITHUB_WORKSPACE}/tap/${{ inputs.formula_path }}"
          test -f "${formula}"
          awk -v sha256="${{ steps.release_asset.outputs.sha256 }}" -v url="${{ steps.release_asset.outputs.url }}" '
            /^[[:space:]]*url "/ && !url_written {
              indent = substr($0, 1, match($0, /[^[:space:]]/) - 1)
              print indent "url \"" url "\""
              url_written = 1
              next
            }
            /^[[:space:]]*sha256 "/ && !sha256_written {
              indent = substr($0, 1, match($0, /[^[:space:]]/) - 1)
              print indent "sha256 \"" sha256 "\""
              sha256_written = 1
              next
            }
            { print }
            END {
              if (!url_written || !sha256_written) {
                exit 1
              }
            }
          ' "${formula}" > "${formula}.next"
          mv "${formula}.next" "${formula}"
          git -C "${GITHUB_WORKSPACE}/tap" diff --check
          git -C "${GITHUB_WORKSPACE}/tap" diff -- "${{ inputs.formula_path }}"

      - name: "📤 Open Formula Pull Request"
        if: inputs.dry_run != true
        shell: sh
        run: |
          set -eu
          branch="bot/maintenance-homebrew-${{ github.event.repository.name }}-${{ inputs.version }}"
          if git -C "${GITHUB_WORKSPACE}/tap" diff --quiet -- "${{ inputs.formula_path }}"; then
            echo "Formula is already up to date."
            exit 0
          fi
          git -C "${GITHUB_WORKSPACE}/tap" add -- "${{ inputs.formula_path }}"
          git -C "${GITHUB_WORKSPACE}/tap" commit -m "brew: ${{ inputs.formula_path }} ${{ inputs.version }}"
          git -C "${GITHUB_WORKSPACE}/tap" push origin "${branch}"
          pr=$(GH_TOKEN="${{ secrets.HOMEBREW_TAP_TOKEN }}" gh pr list --repo "${{ inputs.tap_repository }}" --head "${branch}" --state open --json number --jq '.[0].number')
          if [ -n "${pr}" ]; then
            echo "Formula pull request already exists: #${pr}"
          else
            GH_TOKEN="${{ secrets.HOMEBREW_TAP_TOKEN }}" gh pr create --repo "${{ inputs.tap_repository }}" --base main --head "${branch}" --title "brew: ${{ inputs.formula_path }} ${{ inputs.version }}" --body ''
          fi
