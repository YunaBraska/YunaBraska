name: 🏷️ CD · GitHub Release

on:
  workflow_call:
    inputs:
      run_id:
        description: Build run.
        required: false
        default: ''
        type: string
      commit_sha:
        description: Build commit.
        required: true
        type: string
      version:
        description: Release version.
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: "📥 Download Build"
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: build-workspace
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id || github.run_id }}

      - name: "🏷️ GitHub Release [${{ inputs.version }}]"
        shell: sh
        run: |
          set -eu
          created=false
          tag_existed=false
          cleanup() {
            status=$?
            if [ "${status}" -ne 0 ] && [ "${created}" = true ]; then
              if [ "${tag_existed}" = true ]; then
                GH_TOKEN="${{ github.token }}" gh release delete "${{ inputs.version }}" --repo "${{ github.repository }}" --yes || true
              else
                GH_TOKEN="${{ github.token }}" gh release delete "${{ inputs.version }}" --repo "${{ github.repository }}" --yes --cleanup-tag || true
              fi
            fi
            exit "${status}"
          }
          trap cleanup 0
          if GH_TOKEN="${{ github.token }}" gh release view "${{ inputs.version }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "GitHub release already exists for ${{ inputs.version }}"
            exit 0
          fi
          if GH_TOKEN="${{ github.token }}" gh api "repos/${{ github.repository }}/git/ref/tags/${{ inputs.version }}" >/dev/null 2>&1; then
            tag_existed=true
          fi
          case "${{ inputs.version }}" in
            *-*)
              GH_TOKEN="${{ github.token }}" gh release create "${{ inputs.version }}" --repo "${{ github.repository }}" --target "${{ inputs.commit_sha }}" --generate-notes --draft --prerelease --latest=false
              ;;
            *)
              GH_TOKEN="${{ github.token }}" gh release create "${{ inputs.version }}" --repo "${{ github.repository }}" --target "${{ inputs.commit_sha }}" --generate-notes --draft
              ;;
          esac
          created=true
          set --
          for artifact in dist/*; do
            [ -f "${artifact}" ] || continue
            set -- "$@" "${artifact}"
          done
          test "$#" -gt 0
          GH_TOKEN="${{ github.token }}" gh release upload "${{ inputs.version }}" "$@" --repo "${{ github.repository }}" --clobber
          case "${{ inputs.version }}" in
            *-*) GH_TOKEN="${{ github.token }}" gh release edit "${{ inputs.version }}" --repo "${{ github.repository }}" --draft=false --prerelease ;;
            *) GH_TOKEN="${{ github.token }}" gh release edit "${{ inputs.version }}" --repo "${{ github.repository }}" --draft=false --latest ;;
          esac
          trap - 0
