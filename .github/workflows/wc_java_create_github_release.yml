name: 🏷️ CD · GitHub Release

on:
  workflow_call:
    inputs:
      run_id:
        required: false
        default: ''
        type: string
      commit_sha:
        required: true
        type: string
      version:
        required: true
        type: string

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: "📥 Download Build Artifact"
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: build-workspace
          path: ${{ github.workspace }}
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id || github.run_id }}

      - name: "📦 Prepare Release Assets"
        shell: sh
        run: |
          set -eu
          artifact_id=$(awk -F '[<>]' '/^[[:space:]]*<artifactId>/ { print $3; exit }' pom.xml)
          test -n "${artifact_id}"
          assets_dir="${RUNNER_TEMP}/release-assets"
          rm -rf "${assets_dir}"
          mkdir -p "${assets_dir}"
          cp pom.xml "${assets_dir}/${artifact_id}-${{ inputs.version }}.pom"
          find target -maxdepth 1 -type f -name "*-${{ inputs.version }}*.jar" -exec cp {} "${assets_dir}/" \;
          test -n "$(find "${assets_dir}" -maxdepth 1 -type f -name '*.jar' -print -quit)"

      - name: "🏷️ GitHub Release [${{ inputs.version }}]"
        env:
          GH_TOKEN: ${{ github.token }}
        shell: sh
        run: |
          set -eu
          if gh release view "${{ inputs.version }}" >/dev/null 2>&1; then
            echo "GitHub release already exists for ${{ inputs.version }}"
          else
            gh release create "${{ inputs.version }}" --target "${{ inputs.commit_sha }}" --generate-notes
          fi
          gh release upload "${{ inputs.version }}" "${RUNNER_TEMP}/release-assets"/* --clobber
