name: 🏷️ CD · GitHub Release

on:
  workflow_call:
    inputs:
      run_id:
        description: Build run.
        required: false
        default: ''
        type: string
      commit_sha:
        description: Build commit.
        required: true
        type: string
      version:
        description: Release version.
        required: true
        type: string

permissions: {}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: "📥 Download Build Artifact"
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: build-workspace
          path: ${{ github.workspace }}
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id || github.run_id }}

      - name: "📦 Prepare Release Assets"
        shell: sh
        run: |
          set -eu
          assets_dir="${RUNNER_TEMP}/release-assets"
          mkdir -p "${assets_dir}"
          if [ -d release-assets ]; then
            find release-assets -maxdepth 1 -type f -exec cp {} "${assets_dir}/" \;
          fi
          find target -maxdepth 1 -type f -name "*-${{ inputs.version }}*.jar" -exec cp {} "${assets_dir}/" \;
          test -n "$(find "${assets_dir}" -maxdepth 1 -type f -name '*.jar' -print -quit)"

      - name: "📥 Download Release Assets"
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-assets-*
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id || github.run_id }}

      - name: "🧩 Prepare Executable Assets"
        shell: sh
        run: |
          set -eu
          assets_dir="${RUNNER_TEMP}/release-assets"
          find "${assets_dir}" -maxdepth 1 -type f \( -name '*.native' -o -name '*.exe' \) -exec chmod +x {} \;

      - name: "📤 Upload Prepared Release"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: github-release-assets-${{ github.run_id }}
          path: ${{ runner.temp }}/release-assets
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    needs: prepare
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/wc_github_create_release.yml
    with:
      artifact_name: github-release-assets-${{ github.run_id }}
      artifact_path: release-assets
      commit_sha: ${{ inputs.commit_sha }}
      run_id: ${{ github.run_id }}
      version: ${{ inputs.version }}
