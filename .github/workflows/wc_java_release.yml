name: 🏷️ CD · Release

on:
  workflow_call:
    inputs:
      auto_merge:
        required: false
        default: false
        type: boolean
      force:
        required: false
        default: false
        type: boolean
      github_packages:
        required: false
        default: true
        type: boolean
      maven_central:
        required: false
        default: true
        type: boolean
      upstream_version:
        required: false
        default: ''
        type: string
      version_source:
        required: false
        default: date
        type: string
    secrets:
      BOT_TOKEN:
        required: false
      CENTRAL_PASS:
        required: false
      CENTRAL_USER:
        required: false
      GPG_PASSPHRASE:
        required: false
      GPG_SIGNING_KEY:
        required: false

permissions: {}

concurrency:
  group: java-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  merge:
    if: github.event_name == 'schedule' && inputs.auto_merge == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      checks: read
      contents: write
      pull-requests: write
    outputs:
      enabled: ${{ steps.merge.outputs.enabled }}
    steps:
      - name: "🤖 Merge Green Updates"
        id: merge
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
        shell: sh
        run: |
          set -eu
          if [ -z "${GH_TOKEN:-}" ]; then
            printf 'enabled=false\n'
            printf 'enabled=false\n' >> "${GITHUB_OUTPUT}"
            echo "BOT_TOKEN is not configured; weekly release is disabled."
            exit 0
          fi

          printf 'enabled=true\n'
          printf 'enabled=true\n' >> "${GITHUB_OUTPUT}"
          gh pr list --base main --state open --json number,headRefName,isDraft,mergeStateStatus \
            --jq '.[] | select(.isDraft == false) | select(.mergeStateStatus == "CLEAN") | select((.headRefName | startswith("dependabot/")) or (.headRefName | startswith("bot/maintenance-"))) | .number' \
            | while IFS= read -r pr; do
                if ! gh pr checks "${pr}" >/dev/null 2>&1; then
                  echo "PR #${pr} is not green; leaving it open."
                  continue
                fi
                gh pr merge "${pr}" --squash --delete-branch
              done

  plan:
    needs:
      - merge
    if: ${{ always() && (needs.merge.result == 'success' || needs.merge.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      dry_run_central: ${{ steps.plan.outputs.dry_run_central }}
      dry_run_github_packages: ${{ steps.plan.outputs.dry_run_github_packages }}
      ref: ${{ steps.plan.outputs.ref }}
      should_release: ${{ steps.plan.outputs.should_release }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: "🧑‍💻 Checkout"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: "🏷️ Plan Release"
        id: plan
        shell: sh
        run: |
          set -eu
          auto_merge="${{ inputs.auto_merge }}"
          event_name="${{ github.event_name }}"
          force="${{ inputs.force }}"
          github_packages="${{ inputs.github_packages }}"
          maven_central="${{ inputs.maven_central }}"
          merge_enabled="${{ needs.merge.outputs.enabled }}"
          upstream_version="${{ inputs.upstream_version }}"
          version_source="${{ inputs.version_source }}"
          git fetch --tags origin

          if [ "${event_name}" = "schedule" ]; then
            git fetch origin main
            git checkout --detach origin/main
          fi

          if [ "${maven_central}" = "true" ] && [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Maven Central publishing must run from main." >&2
            exit 1
          fi

          latest_tag=$(git tag --merged HEAD --sort=-creatordate | sed -n '1p')
          has_material_changes=false
          if [ -z "${latest_tag}" ]; then
            has_material_changes=true
          elif ! git diff --quiet "${latest_tag}"..HEAD -- pom.xml src; then
            has_material_changes=true
          fi

          case "${version_source}" in
            date)
              version=$(git log -1 --format=%cs HEAD | tr '-' '.')
              version_changed="${has_material_changes}"
              ;;
            upstream)
              version="${upstream_version}"
              test -n "${version}"
              if [ "${version}" = "${latest_tag}" ]; then
                version_changed=false
              else
                version_changed=true
              fi
              ;;
            *)
              echo "Unsupported version source: ${version_source}" >&2
              exit 1
              ;;
          esac

          should_release=false
          if [ "${event_name}" = "schedule" ]; then
            if [ "${auto_merge}" = "true" ] && [ "${merge_enabled}" = "true" ] && [ "${version_changed}" = "true" ]; then
              should_release=true
            fi
          elif [ "${force}" = "true" ] || [ "${version_changed}" = "true" ]; then
            should_release=true
          fi

          if [ "${should_release}" = "true" ] && git rev-parse -q --verify "refs/tags/${version}" >/dev/null; then
            echo "Release tag already exists: ${version}" >&2
            exit 1
          fi

          if [ "${maven_central}" = "true" ]; then
            dry_run_central=false
          else
            dry_run_central=true
          fi
          if [ "${github_packages}" = "true" ]; then
            dry_run_github_packages=false
          else
            dry_run_github_packages=true
          fi

          ref=$(git rev-parse HEAD)
          {
            printf 'dry_run_central=%s\n' "${dry_run_central}"
            printf 'dry_run_github_packages=%s\n' "${dry_run_github_packages}"
            printf 'ref=%s\n' "${ref}"
            printf 'should_release=%s\n' "${should_release}"
            printf 'version=%s\n' "${version}"
          } >> "${GITHUB_OUTPUT}"

          printf 'dry_run_central=%s\n' "${dry_run_central}"
          printf 'dry_run_github_packages=%s\n' "${dry_run_github_packages}"
          printf 'ref=%s\n' "${ref}"
          printf 'latest_tag=%s\n' "${latest_tag:-none}"
          printf 'has_material_changes=%s\n' "${has_material_changes}"
          printf 'version_source=%s\n' "${version_source}"
          printf 'version=%s\n' "${version}"
          printf 'should_release=%s\n' "${should_release}"

  build:
    needs:
      - plan
    if: ${{ always() && needs.plan.outputs.should_release == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/wc_java_build_common.yml
    with:
      ref: ${{ needs.plan.outputs.ref }}
      release: true
      version: ${{ needs.plan.outputs.version }}

  publish-central:
    needs:
      - plan
      - build
    if: ${{ always() && !cancelled() && needs.build.result == 'success' }}
    permissions:
      actions: read
      contents: read
      deployments: write
    uses: ./.github/workflows/wc_java_publish_central.yml
    with:
      dry_run: ${{ needs.plan.outputs.dry_run_central == 'true' }}
    secrets:
      CENTRAL_USER: ${{ secrets.CENTRAL_USER }}
      CENTRAL_PASS: ${{ secrets.CENTRAL_PASS }}
      GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  publish-github-packages:
    needs:
      - plan
      - build
    if: ${{ always() && !cancelled() && needs.build.result == 'success' }}
    permissions:
      actions: read
      contents: read
      deployments: write
      packages: write
    uses: ./.github/workflows/wc_java_publish_github_packages.yml
    with:
      dry_run: ${{ needs.plan.outputs.dry_run_github_packages == 'true' }}

  create-release:
    needs:
      - plan
      - build
      - publish-central
      - publish-github-packages
    if: ${{ always() && !cancelled() && needs.build.result == 'success' && needs.publish-central.result == 'success' && needs.publish-github-packages.result == 'success' }}
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/wc_java_create_github_release.yml
    with:
      commit_sha: ${{ needs.build.outputs.commit_sha }}
      version: ${{ needs.plan.outputs.version }}
