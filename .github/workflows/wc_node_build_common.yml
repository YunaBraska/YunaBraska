name: 🧩 CI · Node Build

on:
  workflow_call:
    inputs:
      ref:
        description: Checkout ref.
        required: false
        default: ''
        type: string
    outputs:
      commit_sha:
        description: Build commit.
        value: ${{ jobs.build.outputs.commit_sha }}

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      commit_sha: ${{ steps.commit_info.outputs.commit_sha }}
    steps:
      - name: "🧑‍💻 Checkout"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}
          submodules: recursive

      - name: "🧾 Read Commit"
        id: commit_info
        shell: sh
        run: |
          set -eu
          commit_sha=$(git rev-parse HEAD)
          printf 'commit_sha=%s\n' "${commit_sha}"
          printf 'commit_sha=%s\n' "${commit_sha}" >> "${GITHUB_OUTPUT}"

      - name: "🟢 Setup Node [24]"
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm

      - name: "📦 Install"
        shell: sh
        run: npm ci

      - name: "🧪 Build and Test"
        shell: sh
        run: npm test

      - name: "🧼 Check Generated Output"
        shell: sh
        run: git diff --exit-code
