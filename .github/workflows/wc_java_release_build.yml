name: Build Java

on:
  workflow_call:
    inputs:
      ref:
        description: Commit, branch, or tag to build.
        required: true
        type: string
      release:
        description: Build a versioned release workspace for publication.
        required: false
        default: false
        type: boolean
      version:
        description: Version to apply only to this release workspace.
        required: false
        default: ''
        type: string
    outputs:
      commit_sha:
        description: Immutable source revision that produced the workspace.
        value: ${{ jobs.build.outputs.commit_sha }}
      build_output_timestamp:
        description: UTC commit timestamp used for reproducible build output.
        value: ${{ jobs.build.outputs.build_output_timestamp }}

permissions: {}

jobs:
  build:
    name: Build Java
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      commit_sha: ${{ steps.commit_info.outputs.commit_sha }}
      build_output_timestamp: ${{ steps.commit_info.outputs.build_output_timestamp }}
    steps:
      - name: "Checkout ${{ inputs.ref }}"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Read commit information
        id: commit_info
        shell: sh
        run: |
          set -eu
          printf 'commit_sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'build_output_timestamp=%s\n' "$(git log -1 --format=%cI HEAD)" >> "$GITHUB_OUTPUT"

      - name: Read Java information
        id: java_info
        uses: YunaBraska/java-info-action@11a434ffbf6bb3357363d1933be71a4076a90a6b # v3

      - name: Set up Java ${{ steps.java_info.outputs.java_version }}
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: ${{ steps.java_info.outputs.java_version }}
          cache: maven

      - name: Check release version
        if: inputs.release == true
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: sh
        run: |
          set -eu
          test -n "$RELEASE_VERSION"

      - name: Set release version ${{ inputs.version }}
        if: inputs.release == true
        env:
          BUILD_OUTPUT_TIMESTAMP: ${{ steps.commit_info.outputs.build_output_timestamp }}
          RELEASE_VERSION: ${{ inputs.version }}
        shell: sh
        run: ${{ steps.java_info.outputs.cmd }} -B -Dproject.build.outputTimestamp="${BUILD_OUTPUT_TIMESTAMP}" versions:set -DnewVersion="${RELEASE_VERSION}" -DgenerateBackupPoms=false

      - name: Build release packages
        if: inputs.release == true
        env:
          BUILD_OUTPUT_TIMESTAMP: ${{ steps.commit_info.outputs.build_output_timestamp }}
        shell: sh
        run: ${{ steps.java_info.outputs.cmd }} -B -Prelease -Dproject.build.outputTimestamp="${BUILD_OUTPUT_TIMESTAMP}" -Dgpg.skip=true verify

      - name: Build and test
        if: inputs.release != true
        shell: sh
        run: ${{ steps.java_info.outputs.cmd }} -B verify

      - name: Upload release workspace
        if: inputs.release == true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: java-release-workspace
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
          path: |
            .
            !.git
            !.git/**
            !**/target/site
            !**/target/site/**
            !**/target/apidocs
            !**/target/apidocs/**
            !**/target/javadoc-bundle-options
            !**/target/javadoc-bundle-options/**
            !**/target/maven-javadoc-plugin-stale-data.txt
            !**/target/jacoco.exec
            !**/target/surefire-reports
            !**/target/surefire-reports/**
