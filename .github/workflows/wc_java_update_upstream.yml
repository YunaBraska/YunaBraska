name: 🛠️ CI · Upstream

on:
  workflow_call:
    inputs:
      upstream_repository:
        description: Upstream GitHub repository.
        required: true
        type: string
      upstream_property:
        description: Maven property following the stable upstream release.
        required: false
        default: ''
        type: string
      published_artifact:
        description: Maven groupId:artifactId that must be published to Central before updating the property.
        required: false
        default: ''
        type: string
      maintenance_test_property:
        description: Optional Java system property for a repository-specific source update performed during maintenance.
        required: false
        default: ''
        type: string
      dry_run:
        description: Dry run.
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: write
      contents: write
      packages: read
      pull-requests: write
    steps:
      - name: "🧑‍💻 Checkout"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          submodules: recursive

      - name: "🔍 Read Java Info"
        id: java_info
        uses: YunaBraska/java-info-action@11a434ffbf6bb3357363d1933be71a4076a90a6b # v3

      - name: "☕ Setup Java [${{ steps.java_info.outputs.java_version }}]"
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ steps.java_info.outputs.java_version }}
          cache: maven
          server-id: github
          server-username-env-var: GITHUB_ACTOR
          server-password-env-var: MAVEN_GITHUB_TOKEN

      - name: "🏷️ Read Upstream"
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        shell: sh
        run: |
          set -eu
          upstream_version=''
          if [ -n "${{ inputs.upstream_property }}" ]; then
            upstream_tag=$(gh api "repos/${{ inputs.upstream_repository }}/releases/latest" --jq '.tag_name')
            upstream_version=${upstream_tag#v}
            if ! printf '%s\n' "${upstream_version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "${{ inputs.upstream_repository }} latest release is not stable SemVer: ${upstream_tag}" >&2
              exit 1
            fi
          fi
          printf 'upstream_version=%s\n' "${upstream_version}" >> "${GITHUB_OUTPUT}"
          printf 'upstream_repository=%s\n' "${{ inputs.upstream_repository }}"
          printf 'upstream_version=%s\n' "${upstream_version:-none}"

      - name: "🧾 Read Maintenance"
        id: maintenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: sh
        run: |
          set -eu
          branch='bot/maintenance-upstream'
          open=false
          if gh pr list --repo "${GITHUB_REPOSITORY}" --head "${branch}" --state open --json number --jq '.[0].number // empty' | grep -q .; then
            open=true
          fi
          branch_sha=''
          if gh api --silent "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" >/dev/null 2>&1; then
            branch_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq '.object.sha')
          fi
          {
            printf 'branch=%s\n' "${branch}"
            printf 'branch_sha=%s\n' "${branch_sha}"
            printf 'open=%s\n' "${open}"
          } >> "${GITHUB_OUTPUT}"
          printf 'branch=%s\n' "${branch}"
          printf 'branch_sha=%s\n' "${branch_sha:-none}"
          printf 'open=%s\n' "${open}"

      - name: "🛠️ Update"
        id: update
        if: steps.maintenance.outputs.open != 'true'
        env:
          MAVEN_GITHUB_TOKEN: ${{ github.token }}
          MAINTENANCE_TEST_PROPERTY: ${{ inputs.maintenance_test_property }}
          PUBLISHED_ARTIFACT: ${{ inputs.published_artifact }}
          UPSTREAM_PROPERTY: ${{ inputs.upstream_property }}
          UPSTREAM_VERSION: ${{ steps.upstream.outputs.upstream_version }}
        shell: sh
        run: |
          set -eu
          if [ -n "$UPSTREAM_PROPERTY" ]; then
            if [ -n "$PUBLISHED_ARTIFACT" ]; then
              artifact_group=$PUBLISHED_ARTIFACT
              artifact_group=${artifact_group%%:*}
              artifact_id=$PUBLISHED_ARTIFACT
              artifact_id=${artifact_id#*:}
              if [ -z "$artifact_group" ] || [ -z "$artifact_id" ] || [ "$artifact_group" = "$artifact_id" ]; then
                printf '%s\n' "Invalid published_artifact, expected groupId:artifactId: $PUBLISHED_ARTIFACT" >&2
                exit 1
              fi
              artifact_path=$(printf '%s' "$artifact_group" | tr . /)
              artifact_url="https://repo.maven.apache.org/maven2/${artifact_path}/${artifact_id}/${UPSTREAM_VERSION}/${artifact_id}-${UPSTREAM_VERSION}.pom"
              artifact_status=$(curl --location --output /dev/null --silent --write-out '%{http_code}' "$artifact_url")
              case "$artifact_status" in
                200) ;;
                404)
                  printf '%s\n' "Waiting for ${artifact_group}:${artifact_id}:${UPSTREAM_VERSION} in Maven Central."
                  printf 'current=true\n' >> "${GITHUB_OUTPUT}"
                  exit 0
                  ;;
                *)
                  printf '%s\n' "Cannot verify Maven Central artifact: $artifact_url (HTTP $artifact_status)" >&2
                  exit 1
                  ;;
              esac
            fi
            ${{ steps.java_info.outputs.cmd }} -B -N versions:set-property -Dproperty="$UPSTREAM_PROPERTY" -DnewVersion="$UPSTREAM_VERSION" -DgenerateBackupPoms=false
          fi
          if [ -n "$MAINTENANCE_TEST_PROPERTY" ]; then
            if ! printf '%s\n' "$MAINTENANCE_TEST_PROPERTY" | grep -Eq '^[A-Za-z0-9_.-]+=[^[:space:]]+$'; then
              printf '%s\n' "Invalid maintenance_test_property, expected name=value." >&2
              exit 1
            fi
            ${{ steps.java_info.outputs.cmd }} -B "-D$MAINTENANCE_TEST_PROPERTY" test
          else
            ${{ steps.java_info.outputs.cmd }} -B test
          fi
          current=false
          if git diff --quiet; then
            current=true
          fi
          printf 'current=%s\n' "${current}" >> "${GITHUB_OUTPUT}"
          printf 'current=%s\n' "${current}"

      - name: "🛠️ Create Pull Request"
        if: inputs.dry_run != true && steps.maintenance.outputs.open != 'true' && steps.update.outputs.current != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: sh
        run: |
          set -eu
          git config user.name 'Kira Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "${{ steps.maintenance.outputs.branch }}"
          git diff --name-only | while IFS= read -r file_name; do
            git add -- "${file_name}"
          done
          git commit -m 'build: update upstream sources'
          if [ -n "${{ steps.maintenance.outputs.branch_sha }}" ]; then
            git push --force-with-lease="refs/heads/${{ steps.maintenance.outputs.branch }}:${{ steps.maintenance.outputs.branch_sha }}" origin "${{ steps.maintenance.outputs.branch }}"
          else
            git push origin "${{ steps.maintenance.outputs.branch }}"
          fi
          gh pr create --repo "${GITHUB_REPOSITORY}" --base "${{ github.event.repository.default_branch }}" --head "${{ steps.maintenance.outputs.branch }}" --title 'build: update upstream sources' --body 'Updates ${{ inputs.upstream_repository }}.'
          gh workflow run build-pr.yml --repo "${GITHUB_REPOSITORY}" --ref "${{ steps.maintenance.outputs.branch }}"

      - name: "🧪 Dry Run"
        if: inputs.dry_run == true && steps.maintenance.outputs.open != 'true' && steps.update.outputs.current != 'true'
        shell: sh
        run: printf 'Would create %s.\n' "${{ steps.maintenance.outputs.branch }}"
