name: "🔄 CD · Swift Snapshot"

on:
  workflow_call:
    inputs:
      ref:
        description: Exact main-branch revision.
        required: false
        default: ''
        type: string
    outputs:
      commit_sha:
        description: Tested source revision.
        value: ${{ jobs.build.outputs.commit_sha }}
      version:
        description: Built snapshot version.
        value: ${{ jobs.build.outputs.version }}

permissions: {}

jobs:
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/wc_swift_build_common.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
      dry_run: true
      upload_artifact: true
