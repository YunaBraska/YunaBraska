name: "[WC] Create Java GitHub Release"

on:
  workflow_call:
    inputs:
      ref:
        description: Immutable source revision that produced the release workspace.
        required: true
        type: string
      version:
        description: Release version and tag name.
        required: true
        type: string

permissions: {}

jobs:
  create-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout ${{ inputs.ref }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Download release workspace
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: java-release-workspace
          path: ${{ github.workspace }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read Java information
        id: java_info
        uses: YunaBraska/java-info-action@11a434ffbf6bb3357363d1933be71a4076a90a6b # v3

      - name: Prepare release assets
        env:
          ARTIFACT_ID: ${{ steps.java_info.outputs.artifact_name }}
          RELEASE_VERSION: ${{ inputs.version }}
        shell: sh
        run: |
          set -eu
          assets_dir="$RUNNER_TEMP/release-assets"
          rm -rf "$assets_dir"
          mkdir -p "$assets_dir"
          cp pom.xml "$assets_dir/${ARTIFACT_ID}-${RELEASE_VERSION}.pom"
          cp "target/${ARTIFACT_ID}-${RELEASE_VERSION}.jar" "$assets_dir/"
          cp "target/${ARTIFACT_ID}-${RELEASE_VERSION}-sources.jar" "$assets_dir/"
          cp "target/${ARTIFACT_ID}-${RELEASE_VERSION}-javadoc.jar" "$assets_dir/"

      - name: Create GitHub release ${{ inputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
          TARGET_SHA: ${{ inputs.ref }}
        shell: sh
        run: |
          set -eu
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "GitHub release already exists for $RELEASE_VERSION"
          else
            gh release create "$RELEASE_VERSION" --target "$TARGET_SHA" --generate-notes
          fi
          gh release upload "$RELEASE_VERSION" "$RUNNER_TEMP/release-assets"/* --clobber
