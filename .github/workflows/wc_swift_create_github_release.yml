name: 🏷️ CD · GitHub Release

on:
  workflow_call:
    inputs:
      run_id:
        description: Build run.
        required: false
        default: ''
        type: string
      commit_sha:
        description: Build commit.
        required: true
        type: string
      version:
        description: Release version.
        required: true
        type: string
    secrets:
      RELEASE_TOKEN:
        description: Optional repository publisher credential with Contents and Workflows write access.
        required: false

permissions:
  actions: read
  contents: write

jobs:
  release:
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/wc_github_create_release.yml
    with:
      artifact_name: build-workspace
      artifact_path: dist
      commit_sha: ${{ inputs.commit_sha }}
      run_id: ${{ inputs.run_id }}
      version: ${{ inputs.version }}
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
