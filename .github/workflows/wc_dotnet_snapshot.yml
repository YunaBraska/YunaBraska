name: "🔄 CD · .NET Snapshot"

on:
  workflow_call:
    inputs:
      ref:
        description: Exact main-branch revision.
        required: false
        default: ''
        type: string
    outputs:
      commit_sha:
        description: Tested source revision.
        value: ${{ jobs.build.outputs.commit_sha }}
      version:
        description: Built snapshot version.
        value: ${{ jobs.build.outputs.version }}

permissions: {}

jobs:
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/wc_dotnet_build_common.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
      dry_run: true

  native:
    needs: build
    permissions:
      contents: read
    uses: ./.github/workflows/wc_dotnet_build_native.yml
    with:
      dry_run: true
      version: ${{ needs.build.outputs.version }}
