name: 🏷️ CD · Release

on:
  workflow_call:
    outputs:
      commit_sha:
        description: Build commit.
        value: ${{ jobs.build.outputs.commit_sha }}
      dry_run:
        description: No new version to publish.
        value: ${{ jobs.release.outputs.dry_run }}
      version:
        description: Resolved release version.
        value: ${{ jobs.build.outputs.version }}
    inputs:
      force:
        description: Publish unchanged source.
        required: false
        default: false
        type: boolean
      semver_strategy:
        description: Semver next strategy.
        required: false
        default: ''
        type: string
      upstream_version:
        description: Upstream version.
        required: false
        default: ''
        type: string
permissions: {}

concurrency:
  group: java-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/wc_java_build_common.yml
    with:
      ref: ${{ github.sha }}
      semver_strategy: ${{ inputs.semver_strategy }}
      upstream_version: ${{ inputs.upstream_version }}
      upload_artifact: true

  release:
    needs:
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      dry_run: ${{ steps.release_info.outputs.dry_run }}
    steps:
      - name: "🧑‍💻 Checkout"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: "🏷️ Release"
        id: release_info
        shell: sh
        run: |
          set -eu
          version="${{ needs.build.outputs.version }}"
          case "${{ inputs.semver_strategy }}" in
            snapshot)
              dry_run=false
              ;;
            '')
              dry_run=true
              if [ "${{ inputs.force }}" = "true" ]; then
                dry_run=false
              elif [ -n "${{ inputs.upstream_version }}" ]; then
                if ! git rev-parse -q --verify "refs/tags/${version}" >/dev/null; then
                  dry_run=false
                fi
              else
                latest_tag=$(git tag --merged HEAD --sort=-creatordate | sed -n '1p')
                if [ -z "${latest_tag}" ] || ! git diff --quiet "${latest_tag}"..HEAD -- pom.xml src; then
                  dry_run=false
                fi
              fi
              ;;
            *)
              if git rev-parse -q --verify "refs/tags/${version}" >/dev/null; then
                dry_run=true
              else
                dry_run=false
              fi
              ;;
          esac

          if [ "${GITHUB_REF}" != "refs/heads/${{ github.event.repository.default_branch }}" ]; then
            dry_run=true
          fi

          case "${version}" in
            *-SNAPSHOT)
              ;;
            *)
              if [ "${dry_run}" = "false" ] && git rev-parse -q --verify "refs/tags/${version}" >/dev/null; then
                echo "Release tag already exists: ${version}" >&2
                exit 1
              fi
              ;;
          esac

          {
            printf 'dry_run=%s\n' "${dry_run}"
          } >> "${GITHUB_OUTPUT}"
          printf 'dry_run=%s\n' "${dry_run}"
          printf 'semver_strategy=%s\n' "${{ inputs.semver_strategy }}"
          printf 'version=%s\n' "${version}"
